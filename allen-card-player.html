<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Josh Allen · Interactive Card</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:#e7edf6;font:14px system-ui,sans-serif}main{width:min(100%,580px);margin:auto}.stage{position:relative;aspect-ratio:780/1280;background:#17263b;border-radius:24px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:30px;text-align:center}.controls{display:flex;justify-content:center;gap:8px;padding:12px 8px 0;flex-wrap:wrap}button,a{font:inherit;border:1px solid #66809f;background:#17263b;color:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #65b9ff;outline-offset:-3px}#status{color:#65758a;text-align:center;font-size:12px;min-height:32px;margin:9px 12px 0}[hidden]{display:none!important}
</style></head><body><main><div class="stage"><canvas id="card" tabindex="0" aria-label="Josh Allen trading card. Click or tap to flip. Move the pointer to tilt."></canvas><div id="loading" role="status">Loading card…</div></div><div class="controls"><button id="tilt" disabled hidden>Enable tilt</button><button id="center" hidden>Reset center</button><a id="open" target="_blank" rel="noopener" hidden>Open full screen</a></div><p id="status" aria-live="polite">Move your pointer to tilt · Click the card to flip</p></main>
<script src="https://www.rivemasterclass.com/rive-runtime/2.42.0/rive.js"></script><script type="module">
const clamp=(v,n)=>Math.max(-n,Math.min(n,v));
const angleDelta=(a,b)=>((a-b+540)%360)-180;
function screenTilt(beta,gamma,angle){const r=angle*Math.PI/180;return {x:beta*Math.cos(r)+gamma*Math.sin(r),y:gamma*Math.cos(r)-beta*Math.sin(r)};}
function tiltFrom(current,neutral){return {x:clamp(angleDelta(current.x,neutral.x)*.35,8),y:clamp(angleDelta(current.y,neutral.y)*.45,12)};}
const canvas=document.querySelector('#card'),loading=document.querySelector('#loading'),button=document.querySelector('#tilt'),center=document.querySelector('#center'),status=document.querySelector('#status'),open=document.querySelector('#open');
const mobile=matchMedia('(pointer:coarse)').matches;
let card,x,y,enabled=false,neutral=null,target={x:0,y:0},smooth={x:0,y:0},last=0,raf=0,timer,received=false;
button.hidden=!mobile;if(mobile)status.textContent='Tap the card to flip · Enable tilt to move it with your phone';open.href=location.href;
canvas.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;event.preventDefault();const bounds=canvas.getBoundingClientRect();const point={bubbles:true,pointerId:1,pointerType:'mouse',isPrimary:true,clientX:bounds.left+bounds.width/2,clientY:bounds.top+bounds.height/2,button:0};canvas.dispatchEvent(new PointerEvent('pointerdown',{...point,buttons:1}));canvas.dispatchEvent(new PointerEvent('pointerup',{...point,buttons:0}));});
const fail=()=>{loading.hidden=false;loading.textContent='The card could not load. Please refresh and try again.';button.disabled=true;};
function disable(message){enabled=false;neutral=null;target={x:0,y:0};clearTimeout(timer);window.removeEventListener('deviceorientation',orientation);button.textContent='Enable tilt';center.hidden=true;if(message)status.textContent=message;}
function orientation(event){if(!enabled||document.hidden||!Number.isFinite(event.beta)||!Number.isFinite(event.gamma))return;received=true;clearTimeout(timer);const current=screenTilt(event.beta,event.gamma,screen.orientation?.angle??window.orientation??0);if(!neutral)neutral=current;target=tiltFrom(current,neutral);}
function animate(t){const dt=Math.min((t-last)/1000,.05);last=t;const k=1-Math.exp(-10*dt);smooth.x+=(target.x-smooth.x)*k;smooth.y+=(target.y-smooth.y)*k;if(x&&y){x.value=smooth.x;y.value=smooth.y;}raf=requestAnimationFrame(animate);}
button.addEventListener('click',async()=>{if(enabled){disable('Tilt off · Tap the card to flip');return;}if(!isSecureContext||!window.DeviceOrientationEvent){status.textContent='Phone tilt is unavailable here. Touch controls still work.';return;}button.disabled=true;try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){status.textContent='Motion access was not allowed. You can still tap to flip, or try full screen.';open.hidden=window.self===window.top;return;}enabled=true;neutral=null;received=false;window.addEventListener('deviceorientation',orientation);button.textContent='Disable tilt';center.hidden=false;status.textContent='Hold comfortably, then tilt your phone · Tap to flip';timer=setTimeout(()=>{if(!received){disable('No motion data received. Try opening the player full screen, or use touch.');open.hidden=window.self===window.top;}},5000);}catch(error){disable('Motion is blocked in this embed. Open full screen to try again.');open.hidden=window.self===window.top;}finally{button.disabled=false;}});
center.addEventListener('click',()=>{neutral=null;target={x:0,y:0};status.textContent='Center reset · Tilt your phone to move the card';});screen.orientation?.addEventListener('change',()=>{neutral=null;target={x:0,y:0};});document.addEventListener('visibilitychange',()=>{neutral=null;target={x:0,y:0};if(document.hidden)card?.pause();else card?.play('State Machine 1');});
function resize(){card?.resizeDrawingSurfaceToCanvas(Math.min(devicePixelRatio||1,2));}
if(!window.rive){fail();}else{rive.RuntimeLoader.setWasmUrl('https://www.rivemasterclass.com/rive-runtime/2.42.0/rive.wasm');card=new rive.Rive({src:'https://raw.githubusercontent.com/ZacLy-UI/Rive/main/allen_card_final.riv?v=20260921-tilt',canvas,artboard:'Stage',stateMachine:'State Machine 1',autoplay:true,autoBind:true,enableGPUCanvas:true,enableRiveAssetCDN:true,layout:new rive.Layout({fit:rive.Fit.Contain,alignment:rive.Alignment.Center}),onLoad:()=>{resize();loading.hidden=true;x=card.viewModelInstance?.number('phoneTiltX');y=card.viewModelInstance?.number('phoneTiltY');if(!x||!y){status.textContent='Touch and mouse ready. Phone tilt needs the updated card file.';return;}button.disabled=false;raf=requestAnimationFrame(animate);},onLoadError:fail});new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);}
window.addEventListener('pagehide',()=>{disable();cancelAnimationFrame(raf);card?.cleanup();});window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
</script></body></html>
